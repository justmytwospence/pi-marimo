name: live
on:
  pull_request: {}
  schedule: [{ cron: '0 9 * * 1' }]
  workflow_dispatch: {}
jobs:
  live:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            spec: 'marimo==0.25.2'
            lens: 'marimo-lens==0.2.3'
            tests: test/e2e.test.ts test/e2e-actions.test.ts test/e2e-host.test.ts
            host: '0'
          # The source install has no built frontend assets; only exercise the host path.
          - name: host
            spec: 'marimo @ git+https://github.com/marimo-team/marimo@c74e9e4fee123273c60a0c5e73db41e16698bc2d'
            tests: test/e2e-host.test.ts
            host: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install "$MARIMO_SPEC" pandas ${LENS_SPEC:+"$LENS_SPEC"}
        env:
          MARIMO_SPEC: ${{ matrix.spec }}
          LENS_SPEC: ${{ matrix.lens }}
      - run: npm ci
      - run: PI_MARIMO_LIVE_TEST=1 PI_MARIMO_REQUIRE_HOST="${{ matrix.host }}" npx vitest run --maxWorkers=1 ${{ matrix.tests }}
  main:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install "$MARIMO_SPEC" pandas
        env:
          MARIMO_SPEC: 'marimo @ git+https://github.com/marimo-team/marimo@main'
      - run: npm ci
      - run: PI_MARIMO_LIVE_TEST=1 npx vitest run --maxWorkers=1 test/e2e-host.test.ts
