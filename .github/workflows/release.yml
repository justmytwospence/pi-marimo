name: release
on: { release: { types: [published] } }
permissions: { contents: read, id-token: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@latest
      - run: npm ci && npm run check
      - name: The tag names the package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Publish unless this version is already on npm
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "pi-marimo@$V" version >/dev/null 2>&1; then echo "pi-marimo@$V is already published"; exit 0; fi
          npm publish --provenance --access public
